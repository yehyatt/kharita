# Mapeleven map server: vector tiles, styles, fonts and search on one Hetzner box.
# Copy .env.example to .env, then follow README.md.
services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
      REDIRECT_DOMAINS: ${REDIRECT_DOMAINS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/assets:/srv/assets:ro
      - ./data/site:/srv/site:ro
      - caddy_data:/data
    depends_on: [tiles, api]

  # Accounts, API keys, usage limits and styles (api/server.ts, no dependencies).
  api:
    image: oven/bun:1.3.9-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["bun", "run", "server.ts"]
    environment:
      DOMAIN: ${DOMAIN}
      SESSION_SECRET: ${SESSION_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      FREE_MAP_LOADS: ${FREE_MAP_LOADS:-50000}
      FREE_SEARCHES: ${FREE_SEARCHES:-50000}
      ANON_SEARCH_PER_MINUTE: ${ANON_SEARCH_PER_MINUTE:-120}
    volumes:
      - ./api:/app:ro
      - ./data/styles:/srv/styles:ro
      - ./data/api:/data
    depends_on: [tiles]

  tiles:
    image: protomaps/go-pmtiles:v1.30.3
    restart: unless-stopped
    command: ["serve", "/tiles", "--public-url=https://${DOMAIN}/tiles", "--port=8080"]
    volumes:
      - ./data/tiles:/tiles:ro

  search:
    image: eclipse-temurin:21-jre
    restart: unless-stopped
    profiles: ["search"]
    working_dir: /photon
    command: ["java", "-Xmx${PHOTON_HEAP:-2g}", "-jar", "photon.jar", "serve",
              "-data-dir", "/photon", "-listen-ip", "0.0.0.0", "-listen-port", "2322"]
    volumes:
      - ./data/photon:/photon

volumes:
  caddy_data:
